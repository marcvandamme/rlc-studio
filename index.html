<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="RLC Studio — a modern AC circuit calculator, phasor and frequency-response visualizer, and teaching tool."
    />
    <meta name="theme-color" content="#f8fafc" />
    <title>RLC Studio — AC Circuit Lab</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      try {
        const saved = localStorage.getItem('rlc-studio:theme');
        if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (_) {}
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="min-h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
